worker_processes 1;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }        # the Rive runtime is an ES module (.mjs); browsers refuse it with the wrong type
  default_type application/octet-stream;

  server {
    listen 8443 ssl;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store" always;

    # /<name>/whip and /<name>/whep (plus the session URLs under them) -> MediaMTX.
    # Same origin as the pages => no CORS, no mixed content.
    location ~ ^/[^/]+/(whip|whep)(/.*)?$ {
      proxy_pass http://mediamtx:8889;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      client_max_body_size 1m;
    }

    # comments (Server-Sent Events) and avatar replies -> chat server
    location = /events {
      proxy_pass http://chat:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }
    location = /chat {
      proxy_pass http://chat:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      client_max_body_size 4k;
    }
    location /audio/ {
      proxy_pass http://chat:3000;
    }
  }
}
